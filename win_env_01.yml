```yaml id="fix_env_01"
name: alpine-swift-dashboard

channels:
  - conda-forge

dependencies:
  # R core (IMPORTANT: must be 4.3 for GIS compatibility)
  - r-base=4.3

  # Core Shiny stack
  - r-shiny
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-lubridate
  - r-stringr

  # GIS stack (compatible versions exist for R 4.3)
  - r-sf
  - r-terra
  - r-leaflet
  - r-geosphere

  # Data handling
  - r-data.table
  - r-arrow

  # UI / reporting
  - r-shinydashboard
  - r-shinycssloaders
  - r-htmltools
  - r-rmarkdown
  - r-knitr
  - pandoc

  # System libs
  - gdal
  - geos
  - proj
  - sqlite
  - curl
  - openssl

  # Python (optional)
  - python=3.11
  - pip
```
