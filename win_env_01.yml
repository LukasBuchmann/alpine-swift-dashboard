name: alpine-swift-dashboard

channels:
  - conda-forge

dependencies:
  # -------------------------
  # R core
  # -------------------------
  - r-base=4.3

  # -------------------------
  # Shiny framework
  # -------------------------
  - r-shiny
  - r-bslib
  - r-bsicons
  - r-shinywidgets
  - r-markdown
  - r-htmltools

  # -------------------------
  # Data wrangling
  # -------------------------
  - r-dplyr
  - r-readr
  - r-lubridate
  - r-purrr
  - r-rlang

  # -------------------------
  # Spatial (stable Windows-compatible subset)
  # -------------------------
  - r-sf
  - r-leaflet
  - r-geosphere

  # -------------------------
  # Visualization
  # -------------------------
  - r-ggplot2
  - r-plotly
  - r-scales
  - r-viridislite
  - r-rcolorbrewer

  # -------------------------
  # System / geospatial libs
  # -------------------------
  - gdal
  - geos
  - proj
  - sqlite
  - curl
  - openssl

  # -------------------------
  # Reporting / docs
  # -------------------------
  - pandoc
  - r-rmarkdown
  - r-knitr

  # -------------------------
  # Optional Python layer (safe)
  # -------------------------
  - python=3.11
  - pip
